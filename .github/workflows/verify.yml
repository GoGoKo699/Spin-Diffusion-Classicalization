name: Verify science and hosted mathematics
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install numerical dependencies
        run: python -m pip install -r verification/requirements.txt
      - name: Scientific and learning checks
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          mkdir -p verification/local_results
          python verification/run_all.py --output-dir verification/local_results
          python verification/check_navigation.py --output verification/local_results/navigation.json
      - name: Install hosted comparison dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/hosted-deps" playwright@1.56.1 mathjax-full@3.2.1
          "$RUNNER_TEMP/hosted-deps/node_modules/.bin/playwright" install --with-deps chromium
      - name: Compare actual GitHub mathematical rendering
        env:
          SOURCE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          NODE_PATH="$RUNNER_TEMP/hosted-deps/node_modules" node verification/hosted_tools/capture_hosted_math.cjs \
            --root "$GITHUB_WORKSPACE" --repository "$GITHUB_REPOSITORY" \
            --revision "$SOURCE_REF" --output verification/local_results/hosted
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ github.event.pull_request.head.sha || github.sha }}
          path: verification/local_results/
          retention-days: 7
